services:
  trading-engine:
    build: .
    image: ai-trading-engine:latest
    container_name: trading-engine
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist SQLite DB and trade logs outside the container
      - ./data:/app/data
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      DEFAULT_ASSET: ${DEFAULT_ASSET:-ETH/USDT}
      DEFAULT_TIMEFRAME: ${DEFAULT_TIMEFRAME:-1h}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Resource limits — tune for your server
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      # Container is considered healthy if the process is running
      test: ["CMD", "python", "-c", "import ai_trading_engine"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
