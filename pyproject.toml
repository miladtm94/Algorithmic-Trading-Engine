[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-engine"
version = "0.2.0"
description = "Production-grade hybrid algorithmic trading engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm  = ["openai>=1.40.0"]
prod = ["ccxt>=4.0.0", "python-dotenv>=1.0.0"]
ml   = ["scikit-learn>=1.4.0", "joblib>=1.3.0"]
dev  = ["ruff", "mypy", "pytest", "pytest-cov"]
all  = ["openai>=1.40.0", "ccxt>=4.0.0", "python-dotenv>=1.0.0", "scikit-learn>=1.4.0", "joblib>=1.3.0", "ruff", "mypy", "pytest", "pytest-cov"]

[project.scripts]
ai-trading-engine = "ai_trading_engine.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
